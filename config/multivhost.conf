# Configuración con múltiples virtual hosts para pruebas

# Virtual Host 1 - Sitio principal
server {
    listen 8080;
    server_name example.com;
    port 8080;
    root ./www/site1;
    client_max_body_size 1000000;

    location / {
        allowed_methods GET POST DELETE;
        index index.html;
        autoindex on;
    }

    location /cgi {
        allowed_methods GET POST;
        root ./www/site1/cgi;
    }

    location /upload {
        allowed_methods POST;
        upload_path ./www/uploads1;
    }
}

# Virtual Host 2 - Sitio de API
server {
    listen 8081;
    server_name api.example.com;
    port 8081;
    root ./www/site2;
    client_max_body_size 2000000;

    location / {
        allowed_methods GET POST;
        index index.html;
        autoindex on;
    }

    location /api {
        allowed_methods GET POST;
        root ./www/site2;
    }

    location /data {
        allowed_methods POST DELETE;
        upload_path ./www/uploads2;
    }
}

# Virtual Host 3 - Sitio de administración
server {
    listen 8082;
    server_name admin.example.com;
    port 8082;
    root ./www/site3;
    client_max_body_size 5000000;

    location / {
        allowed_methods GET;
        index index.html;
        autoindex off;
    }

    location /static {
        allowed_methods GET;
        index index.html;
        autoindex on;
    }
}
